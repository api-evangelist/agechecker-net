description: >-
  AgeChecker.Net provides age verification API services for e-commerce businesses selling age-restricted products such
  as alcohol, tobacco, cannabis, and firearms. The API enables seamless background verification for most customers and
  guided photo ID verification for those who cannot be automatically verified.
